name: Publish iPhone preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Unpack optional HD Facebook avatar archive
        run: |
          archive=''
          for candidate in caua_avatar_50_original_quality*.zip; do
            if [ -f "$candidate" ]; then archive="$candidate"; break; fi
          done
          if [ -n "$archive" ]; then
            echo "Extracting HD avatars from: $archive"
            unzip -oq "$archive" -d .
            test -f assets/facebook/avatars/hd/extra_001.png
            test -f assets/facebook/avatars/hd/extra_050.png
          fi
      - name: Unpack HD avatar batches 3 and 4
        run: |
          archive=''
          for candidate in npc_batch3_4_combined_hd*.zip; do
            if [ -f "$candidate" ]; then archive="$candidate"; break; fi
          done
          if [ -n "$archive" ]; then
            echo "Extracting batch 3 and 4 from $archive"
            unzip -oq "$archive" -d .
            test -f assets/facebook/avatars/hd/extra_051.png
            test -f assets/facebook/avatars/hd/extra_100.png
          else
            echo "Batch 3+4 ZIP not uploaded yet; existing avatars remain intact"
          fi
      - name: Verify static site and GoodReader scripts
        run: |
          test -f index.html
          node --check assets/goodreader4/goodreader4.js
          test -s assets/goodreader4/GR04_Icon.png
          test -s assets/safari/UFRJ_logo.png
          python -c "from pathlib import Path; d=Path('assets/facebook/avatars/hd'); missing=[i for i in range(1,101) if not (d/('extra_%03d.png'%i)).is_file()]; assert not missing, 'Missing original HD NPC avatars: '+str(missing)"
          python -c "import json; d=json.load(open('assets/goodreader4/documents.json',encoding='utf-8')); assert len(d['documents']) == 2; assert sorted(x['filename'] for x in d['documents']) == ['Dat_rieng_26-08.pdf', 'N09_declaracao_2012.pdf']; assert next(x for x in d['documents'] if x['id']=='n09-2012')['password']=='1111'"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build GoodReader 4 case PDFs
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate PDF files for GoodReader
        run: |
          python -m pip install --quiet reportlab 'pypdf[crypto]'
          python assets/goodreader4/generate_pdfs.py
          test -s assets/goodreader4/docs/Dat_rieng_26-08.pdf
          test -s assets/goodreader4/docs/N09_declaracao_2012.pdf
          python -c "from pypdf import PdfReader; plain=PdfReader('assets/goodreader4/docs/Dat_rieng_26-08.pdf'); locked=PdfReader('assets/goodreader4/docs/N09_declaracao_2012.pdf'); assert not plain.is_encrypted; assert locked.is_encrypted; assert locked.decrypt('1111'); assert len(plain.pages)>=1 and len(locked.pages)>=2"
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
