name: Install HD photos from individual uploads
on:
  push:
    paths:
      - 'hd-uploads/**'
      - '.github/workflows/install-hd-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: install-hd-photos
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy individual JPG and PNG uploads to photos assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('hd-uploads')
          images=sorted(p for p in src.glob('*') if p.is_file() and re.fullmatch(r'photo(?:0[1-9]|[12][0-9]|30)\.(?:jpg|jpeg|png|webp)',p.name,re.I))
          if not images: raise SystemExit('No matching individual HD images; waiting for uploads')
          page=Path('index.html')
          html=page.read_text(encoding='utf-8')
          target=Path('assets/photos')
          target.mkdir(parents=True,exist_ok=True)
          for img in images:
              pid=img.stem.lower()
              filename=pid+img.suffix.lower()
              (target/filename).write_bytes(img.read_bytes())
              pat=r"(\{id:'"+re.escape(pid)+r"',src:)'[^']+'"
              html,count=re.subn(pat,lambda m:m.group(1)+"'./assets/photos/"+filename+"'",html,count=1)
              if count!=1:raise SystemExit('Photo ID not found: '+pid)
          page.write_text(html,encoding='utf-8')
          print('Updated',len(images),'HD photos')
          PY
      - name: Commit updated HTML and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/photos
          git diff --cached --quiet && exit 0
          git commit -m "Refresh HD photos from direct uploads"
          git push
