name: Install HD photos from individual uploads
on:
  push:
    paths:
      - 'photo*.jpg'
      - 'photo*.jpeg'
      - 'photo*.png'
      - 'photo*.webp'
      - 'hd-uploads/**'
      - '.github/workflows/install-hd-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: install-hd-photos
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check complete source-upload batch
        id: source_gate
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          names=[f"photo{i:02d}" for i in range(1,42)]
          roots=[Path("."),Path("hd-uploads")]
          ok=lambda name:any(p.is_file() and p.suffix.lower() in {'.jpg','.jpeg','.png','.webp'} for folder in roots for p in folder.glob(name+'.*'))
          complete=all(ok(name) for name in names)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('ready='+('true' if complete else 'false')+'\n')
          print('Installer '+('ready' if complete else 'skipped: source upload batch was already moved into assets/'))
          PY
      - name: Install uploaded HD photographs
        if: steps.source_gate.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          matches=[]
          for parent in [Path('.'),Path('hd-uploads')]:
              if not parent.exists():continue
              matches.extend(p for p in parent.glob('photo*') if p.is_file() and re.fullmatch(r'photo(?:0[1-9]|[1-3][0-9]|4[01])\.(?:jpg|jpeg|png|webp)',p.name,re.I))
          by_id={}
          for p in matches:
              key=p.stem.lower()
              if key in by_id:raise SystemExit('Duplicate photo ID: '+key)
              by_id[key]=p
          if len(by_id)!=41:raise SystemExit('Expected 41 HD photos; found '+str(len(by_id))+' ('+', '.join(sorted(by_id))+')')
          page=Path('index.html')
          html=page.read_text(encoding='utf-8')
          target=Path('assets/photos')
          target.mkdir(parents=True,exist_ok=True)
          for pid,p in sorted(by_id.items()):
              filename=pid+p.suffix.lower()
              (target/filename).write_bytes(p.read_bytes())
              pattern=r"(\{id:'"+re.escape(pid)+r"',src:)'[^']+'"
              html,n=re.subn(pattern,lambda m:m.group(1)+"'./assets/photos/"+filename+"'",html,count=1)
              if n!=1:raise SystemExit('Unable to match '+pid+' in index.html')
          page.write_text(html,encoding='utf-8')
          print('Installed all 41 original-quality photos')
          PY
      - name: Commit installed HD assets
        if: steps.source_gate.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/photos
          git diff --cached --quiet && exit 0
          git commit -m "Restore all 41 uploaded HD photos"
          git push
