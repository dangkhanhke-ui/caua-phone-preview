name: Install HD photos from JPG batches
on:
  push:
    paths:
      - 'hd-photos-part*.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: install-hd-photos
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import available JPG and PNG batches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,zipfile
          packs=sorted(Path('.').glob('hd-photos-part*.zip'))
          if not packs: raise SystemExit('No HD batches uploaded yet')
          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          target=Path('assets/photos')
          target.mkdir(parents=True,exist_ok=True)
          files={}
          for pack in packs:
              with zipfile.ZipFile(pack) as archive:
                  for name in archive.namelist():
                      if name.endswith('/'):continue
                      basename=Path(name).name
                      m=re.fullmatch(r'(photo(?:0[1-9]|[12][0-9]|30))\.(jpg|jpeg|png|webp)',basename,re.I)
                      if not m:continue
                      pid=m.group(1).lower()
                      if pid in files:raise SystemExit('Duplicate image ID: '+pid)
                      files[pid]=(basename.lower(),archive.read(name))
          if not files: raise SystemExit('No matching photo01-photo30 images')
          for pid,(filename,data) in files.items():
              asset=target/filename
              asset.write_bytes(data)
              pat=r"(\{id:'"+re.escape(pid)+r"',src:)'[^']+'"
              html,count=re.subn(pat,lambda m:m.group(1)+"'./assets/photos/"+filename+"'",html,count=1)
              if count!=1:raise SystemExit('Could not locate '+pid+' in index.html')
          path.write_text(html,encoding='utf-8')
          for pack in packs:pack.unlink()
          print('Installed',len(files),'unique HD photos:',', '.join(sorted(files)))
          PY
      - name: Commit and deploy via Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets/photos 'hd-photos-part*.zip'
          git diff --cached --quiet && exit 0
          git commit -m "Install uploaded HD JPG photos"
          git push
