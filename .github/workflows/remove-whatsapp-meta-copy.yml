name: Polish WhatsApp in-world copy
on:
  push:
    paths:
      - '.github/workflows/remove-whatsapp-meta-copy.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whatsapp-copy-polish
  cancel-in-progress: false
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove out-of-world phrases from both WhatsApp interfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements=[["'<div class=\"wai-descr\">Danh bạ này chỉ gồm các nhân vật đã có trong hồ sơ Cauã, không liên kết danh bạ thật.</div>'","''"],["'<div class=\"wai-descr\">WhatsApp phiên bản iPhone · mô phỏng giao diện tháng 8/2015. Không sử dụng dịch vụ WhatsApp thật.</div>'","''"],["<br><small>Vị trí mô phỏng</small>",""],["'<div class=\"wai-descr\">Số điện thoại hư cấu cho nhân vật Cauã; không dùng để gọi hoặc đăng ký tài khoản thật.</div>'","''"],["'<div class=\"wai-descr\">Thông tin và số điện thoại liên hệ đều là dữ liệu hư cấu trong case.</div></main>'","'</main>'"],["'<div class=\"wai-descr\">Đây là nhóm mô phỏng, không tạo nhóm WhatsApp thật.</div>'","''"],["'<div class=\"wai-subtle\" style=\"color:#c4d2d9;padding:0 23px;text-align:center\">Cuộc gọi thoại mô phỏng, không kết nối tới số thật</div>'","''"],["desc('Chỉ mô phỏng; không có tài khoản WhatsApp thật.')","''"],["desc('Chỉ thiết lập hiển thị trong điện thoại mô phỏng.')","''"],["desc('Mô phỏng tùy chọn bảo mật của thời kỳ này; không mã hóa/gửi tin thật.')","''"],["desc('Số điện thoại Cauã trong game là dữ liệu hư cấu. Để giữ lịch sử case nhất quán, thay đổi số cần được cập nhật trong dữ liệu nhân vật.')","desc('Chuyển thông tin tài khoản và nhóm sang số điện thoại mới.')"],["desc('Âm thanh và thông báo chỉ áp dụng trong mô phỏng.')","''"],["group('Thống kê cục bộ')","group('Thống kê sử dụng')"],["Tin nhắn mô phỏng đã gửi","Tin nhắn đã gửi"],["Cuộc gọi thử nghiệm","Cuộc gọi thoại"],["desc('Không chứa dữ liệu sử dụng mạng từ WhatsApp thật.')","''"],["group('Sao lưu trên thiết bị')","group('Sao lưu trò chuyện')"],["Xuất dữ liệu mô phỏng","Xuất lịch sử trò chuyện"],["desc('Xuất file JSON chứa tin nhắn và cài đặt đã thêm trên thiết bị; không sao lưu iCloud thật.')","''"],["desc('WhatsApp Web bắt đầu hỗ trợ iPhone tháng 8/2015. Bản mô phỏng không quét QR và không liên kết tài khoản thật.')","desc('Trên máy tính, mở web.whatsapp.com để sử dụng WhatsApp Web.')"],["desc('Game điện thoại Cauã · WhatsApp mô phỏng năm 2015.')","''"],["Giao diện dựa trên WhatsApp iOS 2.12.5 · 08/2015","WhatsApp Messenger · v2.12.5"],["desc('Chia sẻ lời mời WhatsApp là thao tác ngoài phạm vi case; để tránh liên hệ người thật, bản mô phỏng không gửi lời mời.')","desc('Mời bạn bè sử dụng WhatsApp.')"],["Đã kết thúc cuộc gọi mô phỏng","Đã kết thúc cuộc gọi"],["Xóa khỏi bản mô phỏng","Xóa tin nhắn"],["Ảnh đã thêm vào cuộc trò chuyện mô phỏng","Đã gửi ảnh"],["Đã xuất bản sao dữ liệu mô phỏng","Đã xuất lịch sử trò chuyện"],["Nhập tin nhắn danh sách phát (mô phỏng):","Nhập tin nhắn danh sách phát:"],["Đã chuyển tiếp trong bản mô phỏng","Đã chuyển tiếp"],["Phản hồi mô phỏng — không gửi ra ngoài","Không thể gửi phản hồi lúc này"],["Cauã WhatsApp iOS 2015 simulation","WhatsApp Messenger"]]
          legacy_replacements=[["'<div class=\"wa-ext-muted\">Cuộc gọi WhatsApp chỉ được mô phỏng trong điện thoại này.</div>'","''"],["Đã tạo nhóm mô phỏng","Đã tạo nhóm"],["Bật thông báo trong mô phỏng","Bật thông báo"],["'<div class=\"wa-ext-muted\">Hồ sơ và cài đặt chỉ lưu cục bộ trong bản mô phỏng, không đồng bộ với WhatsApp thật.</div>'","''"],["<div class=\"wa-ext-muted\" style=\"color:#c0dbd6\">Cuộc gọi mô phỏng · không kết nối mạng</div>",""],["Đã kết thúc cuộc gọi mô phỏng","Đã kết thúc cuộc gọi"],["Tin nhắn mô phỏng đã lưu trên thiết bị","Đã gửi tin nhắn"],["Tính năng WhatsApp Web xuất hiện trên iPhone từ tháng 8/2015. Trên máy tính, mở web.whatsapp.com rồi dùng điện thoại quét mã QR. Bản mockup này không đăng nhập dịch vụ thật.","Trên máy tính, mở web.whatsapp.com rồi quét mã QR."],["WhatsApp Web ra mắt trên iPhone tháng 8/2015. Bản này chỉ mô phỏng giao diện; không thể quét mã hoặc kết nối tài khoản.","Trên máy tính, mở web.whatsapp.com."],["📍 Rio de Janeiro, RJ (vị trí mô phỏng)","📍 Rio de Janeiro, RJ"]]
          for name,items in [('assets/whatsapp/wa-ios8-2015.js',replacements),('assets/whatsapp/wa-enhancements-2015.js',legacy_replacements)]:
              p=Path(name);s=p.read_text(encoding='utf-8')
              for old,new in items:
                  n=s.count(old)
                  if n<1:raise SystemExit('Missing target in '+name+': '+old[:80])
                  s=s.replace(old,new)
              forbidden=['mô phỏng','hư cấu','trong game','không sử dụng dịch vụ WhatsApp thật','Bản mockup','không kết nối tới số thật','không gửi ra ngoài']
              for word in forbidden:
                  if word.casefold() in s.casefold():raise SystemExit('Remaining immersion-breaking copy in '+name+': '+word)
              p.write_text(s,encoding='utf-8')
              print('Cleaned player copy:',name)
          p=Path('.github/workflows/deploy-whatsapp-ios2015.yml')
          s=p.read_text(encoding='utf-8')
          if '20261009c' not in s:raise SystemExit('WhatsApp workflow version not expected')
          p.write_text(s.replace('20261009c','20261009d'),encoding='utf-8')
          html=Path('index.html');s=html.read_text(encoding='utf-8')
          count=s.count('wa-ios8-2015.js?v=20261009c')
          if count!=1:raise SystemExit('Deployed WhatsApp script version missing')
          s=s.replace('wa-ios8-2015.js?v=20261009c','wa-ios8-2015.js?v=20261009d',1)
          s=s.replace('wa-ios8-2015.css?v=20261009c','wa-ios8-2015.css?v=20261009d',1)
          html.write_text(s,encoding='utf-8')
          print('WhatsApp browser cache version updated')
          PY
      - name: Verify syntax and player copy
        run: |
          node --check assets/whatsapp/wa-ios8-2015.js
          node --check assets/whatsapp/wa-enhancements-2015.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/whatsapp/wa-ios8-2015.js').read_text()
          for phrase in ['mô phỏng','hư cấu','không sử dụng dịch vụ','trong game']:
              assert phrase not in s,phrase
          assert 'Đã kết thúc cuộc gọi' in s
          assert 'WhatsApp Messenger · v2.12.5' in s
          print('PASS: JS syntax and WhatsApp copy assertions')
          PY
      - name: Commit and deploy
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html assets/whatsapp/wa-ios8-2015.js assets/whatsapp/wa-enhancements-2015.js .github/workflows/deploy-whatsapp-ios2015.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove out-of-world text from WhatsApp screens and calls"
          git pull --rebase origin main
          git push
