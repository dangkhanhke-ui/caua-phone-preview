name: Phase 2 — Cross App Browser Test
on:
  push:
    paths:
      - 'index.html'
      - 'js/safari.js'
      - 'assets/whatsapp/wa-ios8-2015.js'
      - 'assets/goodreader4/goodreader4.js'
      - 'js/caua-phase2-cross-app.js'
      - 'css/caua-phase2-cross-app.css'
      - 'qa/phase2-cross-app-browser.cjs'
      - '.github/workflows/test-phase2-cross-app.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and prepare browsers
        run: |
          node --check js/caua-phase2-cross-app.js
          node --check js/safari.js
          node --check assets/whatsapp/wa-ios8-2015.js
          node --check assets/goodreader4/goodreader4.js
          node --check qa/phase2-cross-app-browser.cjs
          node qa/phase1-immersion-audit.cjs
          python3 -m http.server 8000 >/tmp/caua-phase2.log 2>&1 &
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test real app handoffs
        run: node qa/phase2-cross-app-browser.cjs
