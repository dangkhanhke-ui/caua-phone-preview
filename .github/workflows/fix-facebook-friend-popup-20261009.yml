name: Fix Facebook Friend Popup Photos
on:
  push:
    paths: ['.github/workflows/fix-facebook-friend-popup-20261009.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use known NPC artwork in profile friend dialog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='Bạn bè với Cauã'+chr(96)+',initials(f.name));}'
          new='Bạn bè với bạn'+chr(96)+',initials(f.name),f.name);}'
          if s.count(old)!=1:raise SystemExit('Expected one friendship status')
          s=s.replace(old,new,1)
          oldsig="function showDialog(head,body,ini='')"
          newsig="function showDialog(head,body,ini='',avatarName='')"
          if s.count(oldsig)!=1:raise SystemExit('Dialog signature changed')
          s=s.replace(oldsig,newsig,1)
          tail="dialog.querySelector('button').onclick=closeOverlay;}"
          if s.count(tail)!=1:raise SystemExit('Dialog tail changed')
          avatar="""if(avatarName){const av=dialog.querySelector('.fb15-dialog-avatar');if(av){av.outerHTML='<div class="fb15-dialog-avatar"'+npcAvatarAttrs(avatarName)+'>'+npcAvatarPhoto(avatarName)+'<span class="fb15-npc-fallback">'+esc(ini)+'</span></div>';}}"""
          s=s.replace(tail,avatar+tail,1)
          p.write_text(s,encoding='utf-8')
          css=Path('css/head-18-facebook-profile-phase2-style.css')
          style=css.read_text(encoding='utf-8')
          style+="""
          /* Use the same photo/portrait as the friend grid in the profile popup. */
          #facebookApp .fb15-dialog-avatar[data-npc-avatar="image"]{
            width:84px;height:84px;min-width:84px;position:relative;
            margin:0 auto 10px;overflow:hidden;border-radius:4px;
            background-color:#cbd4e2;
          }
          #facebookApp .fb15-dialog-avatar[data-npc-avatar="image"] .fb15-npc-fallback{
            position:absolute;inset:0;width:100%;height:100%;
            font-size:21px;z-index:1;
          }
          """
          css.write_text(style,encoding='utf-8')
          print('Updated avatar popup and friendship wording')
          PY
      - name: Verify Facebook script syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          matches=[m.group(1) for m in re.finditer(r'<script\b[^>]*>([\s\S]*?)</script\s*>',s,re.I) if 'function showPerson(name)' in m.group(1)]
          assert len(matches)==1
          assert 'Bạn bè với bạn' in matches[0]
          assert 'npcAvatarPhoto(avatarName)' in matches[0]
          Path('/tmp/fb-popup-inline.js').write_text(matches[0],encoding='utf-8')
          PY
          node --check /tmp/fb-popup-inline.js
      - name: Commit friend popup
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html css/head-18-facebook-profile-phase2-style.css
          git commit -m "Show actual NPC portraits in Facebook friend popups and update wording"
          git pull --rebase origin main
          git push
