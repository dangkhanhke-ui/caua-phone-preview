name: Install Safari HD images
on:
  push:
    paths:
      - 'vertice1.*'
      - 'lapa[1-3].*'
      - 'santa[1-3].*'
      - 'subsolo[1-3].*'
      - 'radar_rio.*'
      - 'caderno_braga.*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: safari-hd-assets
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uploaded Safari image assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html_path=Path('index.html')
          html=html_path.read_text(encoding='utf-8')
          keys=['vertice1','lapa1','lapa2','lapa3','santa1','santa2','santa3','subsolo1','subsolo2','subsolo3','radar_rio','caderno_braga']
          target=Path('assets/safari')
          target.mkdir(parents=True,exist_ok=True)
          changed=0
          for key in keys:
              sources=[p for p in Path('.').glob(key+'.*') if p.suffix.lower() in ('.jpg','.jpeg','.png','.webp')]
              if not sources:continue
              if len(sources)>1:raise SystemExit('Duplicate formats for '+key)
              photo=sources[0]
              filename=key+photo.suffix.lower()
              (target/filename).write_bytes(photo.read_bytes())
              url='./assets/safari/'+filename
              if key in ('radar_rio','caderno_braga'):
                  func='renderRadarRio' if key=='radar_rio' else 'renderCadernoUrbano'
                  a=html.find('function '+func+'()')
                  if a<0:raise SystemExit('Article section missing: '+func)
                  b=html.find('function ',a+len('function '))
                  if b<0:b=len(html)
                  section=html[a:b]
                  pat=r'(<figure class="news-photo-real"><img src=")[^"]+'
                  section,n=re.subn(pat,lambda m:m.group(1)+url,section,count=1)
                  if n!=1:raise SystemExit('Article image missing: '+func)
                  html=html[:a]+section+html[b:]
              else:
                  pat=r'("'+re.escape(key)+r'":")[^"]+'
                  html,n=re.subn(pat,lambda m:m.group(1)+url,html,count=1)
                  if n!=1:raise SystemExit('Safari gallery key missing: '+key)
              changed+=1
          if not changed:
              print('No matching images uploaded yet')
          else:
              html_path.write_text(html,encoding='utf-8')
              print('Updated',changed,'Safari images')
          PY
      - name: Commit image references for Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/safari
          git diff --cached --quiet && exit 0
          git commit -m "Install uploaded HD Safari images"
          git push
