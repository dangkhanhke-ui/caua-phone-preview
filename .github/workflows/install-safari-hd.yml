name: Install Safari and phone screen HD
on:
  push:
    paths:
      - 'vertice1.*'
      - 'lapa*'
      - 'santa*'
      - 'subsolo*'
      - 'radar_rio.*'
      - 'caderno_braga.*'
      - 'phone_screen.*'
      - '.github/workflows/install-safari-hd.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: safari-screen-hd
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check complete source-upload batch
        id: source_gate
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          names=['vertice1','lapa1','lapa2','lapa3','santa1','santa2','santa3','subsolo1','subsolo2','subsolo3','radar_rio','caderno_braga','phone_screen']
          roots=[Path(".")]
          ok=lambda name:any(p.is_file() and p.suffix.lower() in {'.jpg','.jpeg','.png','.webp',' .mp4'} for folder in roots for p in folder.glob(name+'.*'))
          complete=all(ok(name) for name in names)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('ready='+('true' if complete else 'false')+'\n')
          print('Installer '+('ready' if complete else 'skipped: source upload batch was already moved into assets/'))
          PY
      - name: Install all twelve Safari assets and phone wallpaper
        if: steps.source_gate.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page=Path('index.html')
          html=page.read_text(encoding='utf-8')
          keys=['vertice1','lapa1','lapa2','lapa3','santa1','santa2','santa3','subsolo1','subsolo2','subsolo3','radar_rio','caderno_braga']
          target=Path('assets/safari')
          target.mkdir(parents=True,exist_ok=True)
          updated=[]
          def getfile(key):
              hits=[p for p in Path('.').glob(key+'.*') if p.is_file() and p.suffix.lower() in ('.jpg','.jpeg','.png','.webp')]
              if len(hits)!=1:raise SystemExit('Expected exactly one file for '+key+', found '+str(len(hits)))
              return hits[0]
          for key in keys:
              src=getfile(key)
              name=key+src.suffix.lower()
              (target/name).write_bytes(src.read_bytes())
              newurl='./assets/safari/'+name
              if key in ('radar_rio','caderno_braga'):
                  func='renderRadarRio' if key=='radar_rio' else 'renderCadernoUrbano'
                  start=html.find('function '+func+'()')
                  if start<0:raise SystemExit('Article function not found: '+func)
                  end=html.find('\n  function ',start+10)
                  if end<0:end=len(html)
                  section=html[start:end]
                  section,n=re.subn(r'(<figure class="news-photo-real"><img src=")[^"]+',lambda m:m.group(1)+newurl,section,count=1)
                  if n!=1:raise SystemExit('Image tag not found for '+func)
                  html=html[:start]+section+html[end:]
              else:
                  pat=r'(["\x27]'+re.escape(key)+r'["\x27]\s*:\s*["\x27])[^"\x27]+'
                  html,n=re.subn(pat,lambda m:m.group(1)+newurl,html,count=1)
                  if n!=1:raise SystemExit('Safari image key not found: '+key)
              updated.append(key)
          screen=getfile('phone_screen')
          screen_target=Path('assets/screen')
          screen_target.mkdir(parents=True,exist_ok=True)
          screen_name='phone_screen'+screen.suffix.lower()
          (screen_target/screen_name).write_bytes(screen.read_bytes())
          url='./assets/screen/'+screen_name
          pat=r'(?s)(\.wallpaper\s*\{)(.*?)(\})'
          def wallpaper(m):
              rule=m.group(2)
              rule,n=re.subn(r'background-image\s*:\s*[^;]+;',lambda _: 'background-image: url("'+url+'");',rule,count=1)
              if n!=1:raise SystemExit('Wallpaper background-image property not found')
              return m.group(1)+rule+m.group(3)
          html,n=re.subn(pat,wallpaper,html,count=1)
          if n!=1:raise SystemExit('Wallpaper CSS rule not found')
          page.write_text(html,encoding='utf-8')
          print('Installed Safari:',', '.join(updated))
          print('Installed phone wallpaper:',url)
          PY
      - name: Commit and deploy
        if: steps.source_gate.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/safari assets/screen
          git diff --cached --quiet && exit 0
          git commit -m "Install twelve Safari images and phone screen"
          git pull --rebase origin main
          git push
