name: Test Facebook Photo Viewer in Chromium and WebKit
on:
  push:
    paths:
      - '.github/workflows/diagnose-facebook-photo-browser.yml'
      - 'index.html'
      - 'js/facebook-photo-viewer.js'
      - 'css/facebook-photo-viewer.css'
      - 'assets/shared-photo-zoom.js'
      - 'js/facebook-profile-sticky-fix.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate single photo controller
        run: |
          node --check js/facebook-photo-viewer.js
          node --check assets/shared-photo-zoom.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          assert html.count('js/facebook-photo-viewer.js')==1
          assert html.count('css/facebook-photo-viewer.css')==1
          assert 'facebook-lightbox.js' not in html
          assert 'facebook-lightbox.css' not in html
          assert 'fb15-image-viewer-style' not in html
          assert 'fb15-image-viewer-script' not in html
          assert 'facebook-profile-sticky-fix.js' not in html
          assert not Path('js/facebook-profile-sticky-fix.js').exists()
          assert not Path('assets/facebook/facebook-lightbox.js').exists()
          assert not Path('assets/facebook/facebook-lightbox.css').exists()
          print('PASS: single Facebook viewer, no legacy registration')
          PY
      - name: Install Chromium and WebKit
        run: |
          python3 -m http.server 8000 >/tmp/fb-http.log 2>&1 &
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify real profile-to-photo interaction on both engines
        run: |
          cat >/tmp/test-fb.cjs <<'JS'
          const {chromium,webkit}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          const photoSelectors='.fb-photo-clean,.fb15-lightbox,.caua-photo-overlay,.fb15-image-viewer';
          async function one(name,engine){
            const browser=await engine.launch({headless:true});
            try {
              const page=await browser.newPage({viewport:{width:500,height:850},deviceScaleFactor:1,hasTouch:true});
              page.on('pageerror',e=>console.log(name,'PAGE_ERROR:',e.message));
              await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(400);
              const navigated=await page.evaluate(()=>{
                document.querySelector('[data-app="facebook"]')?.click();
                document.querySelector('[data-fbtab="more"]')?.click();
                const link=document.querySelector('#facebookApp [data-pagekind="profile"]');
                if(!link)return {error:'profile link missing'};
                link.click();
                const cover=document.querySelector('#facebookApp .fb15-profile-cover > img:first-child');
                return {app:document.querySelector('#facebookApp').classList.contains('open'),profile:!!cover,cover:cover?.getAttribute('src')};
              });
              console.log(name,'PROFILE',JSON.stringify(navigated));
              // Verify profile tabs belong to the timeline, not a sticky overlay.
              const scrolledTabs=await page.evaluate(()=>{
                const content=document.querySelector('#facebookApp .fb15-content');
                const nav=content.querySelector('.fb15-profile-tabs');
                if(!nav)return {error:'Profile tabs missing'};
                const style=getComputedStyle(nav);
                const initial=nav.getBoundingClientRect();
                content.scrollTop=900;
                const after=nav.getBoundingClientRect();
                const viewport=content.getBoundingClientRect();
                return {position:style.position,initialBottom:initial.bottom,
                  finalBottom:after.bottom,contentTop:viewport.top,
                  scrollTop:content.scrollTop,
                  scrolledAway:after.bottom<viewport.top,
                  movedUp:after.bottom<initial.bottom-300,
                  floatingCopies:document.querySelectorAll('.fb15-profile-tabs-overlay').length};
              });
              console.log(name,'PROFILE_TABS_SCROLL',JSON.stringify(scrolledTabs));
              if(scrolledTabs.error||!scrolledTabs.scrolledAway||!scrolledTabs.movedUp||
                 scrolledTabs.floatingCopies!==0||scrolledTabs.position==='sticky'||
                 scrolledTabs.position==='fixed')throw Error(name+' profile tabs still stick/floating');
              if(!navigated.profile || !navigated.app)throw Error(name+' cannot navigate to Cauã profile');
              await page.waitForTimeout(400);
              await page.evaluate(()=>{
                const scroller=document.querySelector('#facebookApp .fb15-content');
                scroller.scrollTop=70;
                const img=document.querySelector('#facebookApp .fb15-profile-cover > img:first-child');
                img.click();
              });
              await page.waitForTimeout(450);
              const result=await page.evaluate(()=>{
                const screen=document.querySelector('#screen'),bar=document.querySelector('#statusBar');
                const facebook=document.querySelector('#facebookApp');
                const panel=screen.querySelector(':scope > .fb-photo-clean');
                const rect=screen.getBoundingClientRect(),v=panel?.getBoundingClientRect();
                const points=[5,22,51,100,150,rect.height-10].map(y=>{
                  const at=document.elementFromPoint(rect.left+rect.width/2,rect.top+y);
                  return {y,cls:at?.className||at?.id,inside:!!panel&&at?.closest('.fb-photo-clean')===panel};
                });
                const image=panel?.querySelector('img');
                return {
                  panel:!!panel,viewerCount:document.querySelectorAll('.fb-photo-clean,.fb15-lightbox,.caua-photo-overlay,.fb15-image-viewer').length,
                  opened:screen.classList.contains('fb-photo-clean-open'),
                  facebookHidden:getComputedStyle(facebook).visibility==='hidden',
                  statusHidden:getComputedStyle(bar).visibility==='hidden',
                  widthMatches:!!v&&Math.abs(v.width-rect.width)<2,heightMatches:!!v&&Math.abs(v.height-rect.height)<2,
                  allInside:points.every(p=>p.inside),points,
                  imageSrc:image?.getAttribute('src')||'',imageComplete:!!image?.complete,imageWidth:image?.naturalWidth||0
                };
              });
              console.log(name,'PHOTO_OPEN',JSON.stringify(result));
              fs.copyFileSync('/tmp/fb-http.log','/tmp/fb-http-copy.log');
              await page.screenshot({path:'/tmp/fb-'+name+'-open.png'});
              for(const key of ['panel','opened','facebookHidden','statusHidden','widthMatches','heightMatches','allInside']){
                if(!result[key])throw Error(name+' photo open: '+key+' false');
              }
              if(result.viewerCount!==1)throw Error(name+' duplicate viewers');
              if(!result.imageSrc)throw Error(name+' lost photo source');
              await page.locator('#screen .fb-photo-clean-back').click();
              const closed=await page.evaluate(()=>{
                const screen=document.querySelector('#screen');
                return {viewers:document.querySelectorAll('.fb-photo-clean,.fb15-lightbox,.caua-photo-overlay,.fb15-image-viewer').length,
                  appVisible:getComputedStyle(document.querySelector('#facebookApp')).visibility==='visible',
                  statusVisible:getComputedStyle(document.querySelector('#statusBar')).visibility==='visible',
                  stateReset:!screen.classList.contains('fb-photo-clean-open'),
                  profilePresent:!!document.querySelector('#facebookApp .fb15-profile-cover')};
              });
              console.log(name,'PHOTO_CLOSED',JSON.stringify(closed));
              if(closed.viewers || !closed.appVisible || !closed.statusVisible || !closed.stateReset || !closed.profilePresent)throw Error(name+' photo close failed');
              await page.evaluate(()=>document.querySelector('#facebookApp .fb15-profile-cover > img:first-child')?.click());
              await page.waitForTimeout(100);
              await page.keyboard.press('Escape');
              const afterEscape=await page.evaluate(()=>document.querySelectorAll('.fb-photo-clean').length);
              if(afterEscape)throw Error(name+' Escape close failed');
              // The user's regression is inside Cauã > Ảnh, not only cover.
              const gallery=await page.evaluate(()=>{
                const tab=document.querySelector('#facebookApp [data-ptab="photos"]');
                if(!tab)return {error:'photos tab missing'};
                tab.click();
                const images=document.querySelectorAll('#facebookApp .fb15-photo-grid img');
                if(!images.length)return {error:'profile image grid empty'};
                const src=images[0].getAttribute('src');
                images[0].click();
                return {count:images.length,src};
              });
              console.log(name,'PROFILE_PHOTOS',JSON.stringify(gallery));
              if(gallery.error)throw Error(name+' profile photos: '+gallery.error);
              await page.waitForTimeout(500);
              const gridResult=await page.evaluate(()=>{
                const screen=document.querySelector('#screen'),panel=screen.querySelector(':scope > .fb-photo-clean'),r=screen.getBoundingClientRect();
                const image=panel?.querySelector('img');
                const covered=[5,40,115,170,260,r.height-10].every(y=>document.elementFromPoint(r.left+r.width/2,r.top+y)?.closest('.fb-photo-clean')===panel);
                return {onlyOne:document.querySelectorAll('.fb-photo-clean,.caua-photo-overlay,.fb15-lightbox,.fb15-image-viewer').length===1,
                  panel:!!panel,covered,barHidden:getComputedStyle(document.querySelector('#statusBar')).visibility==='hidden',
                  appHidden:getComputedStyle(document.querySelector('#facebookApp')).visibility==='hidden',
                  imageWidth:image?.naturalWidth||0,src:image?.getAttribute('src')};
              });
              console.log(name,'PROFILE_PHOTOS_OPEN',JSON.stringify(gridResult));
              await page.screenshot({path:'/tmp/fb-'+name+'-profile-photos.png'});
              if(!gridResult.panel||!gridResult.onlyOne||!gridResult.covered||!gridResult.barHidden||!gridResult.appHidden||!gridResult.imageWidth)throw Error(name+' profile gallery fullscreen check failed');
              await page.locator('#screen .fb-photo-clean-back').click();
              if(await page.locator('#screen .fb-photo-clean').count())throw Error(name+' gallery did not close');
              console.log(name,'PASS profile cover AND profile photo grid open/close/Escape');
            } finally {await browser.close();}
          }
          (async()=>{await one('chromium',chromium);await one('webkit',webkit)})().catch(e=>{console.error('FAIL:',e.stack||e);process.exit(1)});
          JS
          node /tmp/test-fb.cjs | tee /tmp/facebook-browser-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facebook-photo-browser-screenshots
          path: /tmp/fb-*-open.png
