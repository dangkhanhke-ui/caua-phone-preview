name: Diagnose Facebook Photo Stacking in Browser
on:
  push:
    paths: ['.github/workflows/diagnose-facebook-photo-browser.yml', 'assets/shared-photo-zoom.js', 'assets/facebook/facebook-lightbox.js', 'assets/facebook/facebook-lightbox.css']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start site and install browser
        run: |
          python3 -m http.server 8000 >/tmp/fb-http.log 2>&1 &
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect actual visibility and stacking
        run: |
          cat > /tmp/test-fb.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:500,height:850},deviceScaleFactor:1,hasTouch:true});
            page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
            page.on('console',m=>{if(m.type()==='error')console.log('CONSOLE_ERROR',m.text())});
            await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1800);
            const startup=await page.evaluate(()=>{
              const app=document.querySelector('#facebookApp');
              const el=document.querySelector('.facebook-launch')||document.querySelector('[data-app="facebook"]');
              return {launch:el?.outerHTML?.slice(0,260),app:!!app,lightboxSrc:[...document.scripts].filter(s=>s.src.includes('facebook-lightbox')).map(s=>s.src),css:[...document.styleSheets].map(x=>x.href).filter(x=>x?.includes('facebook-lightbox'))};
            });
            console.log('STARTUP',JSON.stringify(startup));
            await page.evaluate(()=>{(document.querySelector('.facebook-launch')||document.querySelector('[data-app="facebook"]'))?.click()});
            await page.waitForTimeout(800);
            console.log('APP',JSON.stringify(await page.evaluate(()=>({opened:document.querySelector('#facebookApp')?.classList.contains('open'),photos:document.querySelectorAll('#facebookApp .fb15-media.photo img').length,photoGrid:document.querySelectorAll('#facebookApp .fb15-photo-grid img').length}))));
            const opened=await page.evaluate(()=>{
              const img=document.querySelector('#facebookApp .fb15-media.photo img')||document.querySelector('#facebookApp .fb15-profile-cover img');
              if(!img)return 'NO PHOTO FOUND';
              img.click();return img.outerHTML.slice(0,250);
            });
            console.log('OPEN',opened);
            await page.waitForTimeout(700);
            const info=await page.evaluate(()=>{
              const screen=document.querySelector('#screen'),bar=document.querySelector('#statusBar'),app=document.querySelector('#facebookApp');
              const photo=document.querySelector('.fb15-lightbox'),other=document.querySelector('.fb15-image-viewer'),nav=document.querySelector('.fb15-profile-tabs-overlay');
              const prop=(e)=>{if(!e)return null;const c=getComputedStyle(e),r=e.getBoundingClientRect();return {parent:e.parentElement?.id||e.parentElement?.className,tag:e.tagName,cls:e.className,display:c.display,visibility:c.visibility,opacity:c.opacity,zIndex:c.zIndex,position:c.position,bounds:{top:r.top,left:r.left,bottom:r.bottom,right:r.right},html:e.outerHTML.slice(0,180)}};
              const rr=screen.getBoundingClientRect();
              return {screen:prop(screen),screenHasPhotoClass:screen.classList.contains('fb15-photo-fullscreen'),bar:prop(bar),app:prop(app),photo:prop(photo),oldViewer:prop(other),nav:prop(nav),elementsAtTop:[5,25,55,95,120,150].map(y=>{const e=document.elementFromPoint(rr.left+100,rr.top+y);return {y,name:e?.id||e?.className||e?.tagName}}),displayStyles:[...document.styleSheets].filter(x=>x.href?.includes('facebook-lightbox')).map(x=>x.href)};
            });
            console.log('LAYERS',JSON.stringify(info,null,2));
            const verify=await page.evaluate(()=>{
              const screen=document.querySelector('#screen'),bar=document.querySelector('#statusBar'),lightbox=screen?.querySelector(':scope > .fb15-lightbox');
              const r=screen.getBoundingClientRect();
              const hits=[5,26,100,130].map(y=>document.elementFromPoint(r.left+Math.min(120,r.width/2),r.top+y)?.closest('.fb15-lightbox')===lightbox);
              return {viewerAttachedToScreen:!!lightbox,onlyOneViewer:document.querySelectorAll('.fb15-lightbox,.caua-photo-overlay,.fb15-image-viewer').length===1,statusHidden:getComputedStyle(bar).visibility==='hidden',fullscreenClass:screen.classList.contains('fb15-photo-fullscreen'),viewerCoversEveryPoint:hits.every(Boolean),hits};
            });
            console.log('ASSERT_OPEN',JSON.stringify(verify));
            if(Object.values(verify).some(v=>v===false))throw Error('Facebook fullscreen failed checks: '+JSON.stringify(verify));
            await page.evaluate(()=>document.querySelector('#screen .fb15-lightbox [data-fb-photo-close]')?.click());
            const afterClose=await page.evaluate(()=>({viewerCount:document.querySelectorAll('.fb15-lightbox,.caua-photo-overlay,.fb15-image-viewer').length,statusVisible:getComputedStyle(document.querySelector('#statusBar')).visibility==='visible',fullscreenClass:document.querySelector('#screen').classList.contains('fb15-photo-fullscreen')}));
            console.log('ASSERT_CLOSE',JSON.stringify(afterClose));
            if(afterClose.viewerCount!==0||!afterClose.statusVisible||afterClose.fullscreenClass)throw Error('Facebook photo cleanup failed');
            await page.screenshot({path:'/tmp/facebook-after-open.png'});
            await browser.close();
          })().catch(e=>{console.error('TEST_ERROR',e.stack||e);process.exit(1)});
          JS
          node /tmp/test-fb.cjs | tee /tmp/facebook-browser-report.txt
      - name: Save browser evidence
        if: always()
        run: |
          mkdir -p qa
          if [ -f /tmp/facebook-browser-report.txt ]; then
            cp /tmp/facebook-browser-report.txt qa/facebook-browser-report.txt
          else
            echo 'Browser test did not reach output stage' > qa/facebook-browser-report.txt
          fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add qa/facebook-browser-report.txt
          git diff --cached --quiet || (git commit -m 'Record actual Facebook fullscreen layer test results' && git pull --rebase origin main && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facebook-photo-debug
          path: /tmp/facebook-after-open.png
