name: Install WhatsApp chat background
on:
  push:
    paths:
      - 'whatsapp_chat_bg.*'
      - '.github/workflows/install-whatsapp-background.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whatsapp-chat-background
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set WhatsApp conversation background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[p for p in Path('.').glob('whatsapp_chat_bg.*') if p.is_file() and p.suffix.lower() in ('.jpg','.jpeg','.png','.webp')]
          if not files:
              print('No WhatsApp background uploaded yet')
              raise SystemExit(0)
          if len(files)!=1:
              raise SystemExit('More than one whatsapp_chat_bg format found')
          source=files[0]
          folder=Path('assets/whatsapp')
          folder.mkdir(parents=True,exist_ok=True)
          dest=folder/('whatsapp_chat_bg'+source.suffix.lower())
          dest.write_bytes(source.read_bytes())
          html_file=Path('index.html')
          html=html_file.read_text(encoding='utf-8')
          url='./'+dest.as_posix()
          style='<style id="wa-hd-chat-wallpaper">#whatsappApp .wa-chat-canvas{background-image:url("'+url+'")!important;background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important}</style>'
          html=re.sub(r'<style id="wa-hd-chat-wallpaper">.*?</style>', '', html, flags=re.S)
          if '</head>' not in html:raise SystemExit('HTML head not found')
          html=html.replace('</head>',style+'</head>',1)
          html_file.write_text(html,encoding='utf-8')
          print('Installed WhatsApp background:',url)
          PY
      - name: Commit and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/whatsapp
          git diff --cached --quiet && exit 0
          git commit -m "Install WhatsApp chat background"
          git pull --rebase origin main
          git push
