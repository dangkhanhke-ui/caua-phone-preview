name: Smooth Safari tab opening
on:
  push:
    paths:
      - '.github/workflows/smooth-safari-tabs.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace Safari jump with continuous card-to-page transition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""    const selectTab=card=>{
      if(!card || tabsView.dataset.busy==='1')return;
      tabsView.dataset.busy='1';
      if(!reduceMotion)card.classList.add('safari-tab-opening');
      window.setTimeout(()=>{
        saveScroll();
        state.currentTabId=card.dataset.tabid;
        hideSafariTabOverview();
        renderCurrent(true);
        tabsView.dataset.busy='';
      },reduceMotion?0:155);
    };"""
          new="""    const selectTab=card=>{
      if(!card || tabsView.dataset.busy==='1')return;
      tabsView.dataset.busy='1';
      const targetId=card.dataset.tabid;
      const finish=()=>{
        saveScroll();
        state.currentTabId=targetId;
        hideSafariTabOverview();
        renderCurrent(true);
        tabsView.dataset.busy='';
      };
      if(reduceMotion){finish();return;}
      // Animate a *single continuous* snapshot rather than zooming the card
      // for 155ms and abruptly swapping the whole screen.
      const rect=card.querySelector('.safari-tab-sheet')?.getBoundingClientRect() || card.getBoundingClientRect();
      const destination=app.getBoundingClientRect();
      const flight=document.createElement('div');
      flight.className='safari-smooth-flight';
      const snapshot=card.querySelector('.safari-tab-sheet');
      if(snapshot)flight.innerHTML=snapshot.innerHTML;
      else flight.innerHTML=card.innerHTML;
      Object.assign(flight.style,{
        left:rect.left+'px',top:rect.top+'px',
        width:rect.width+'px',height:rect.height+'px'
      });
      document.body.appendChild(flight);
      card.style.opacity='0';
      const dx=destination.left-rect.left,dy=destination.top-rect.top;
      const sx=destination.width/Math.max(1,rect.width);
      const sy=destination.height/Math.max(1,rect.height);
      let done=false;
      const complete=()=>{
        if(done)return;
        done=true;
        finish();
        flight.remove();
      };
      const animation=flight.animate([
        {transform:'translate3d(0,0,0) scale(1,1)',borderRadius:'5px',opacity:1,offset:0},
        {transform:`translate3d(${dx*.56}px,${dy*.56}px,0) scale(${1+(sx-1)*.56},${1+(sy-1)*.56})`,borderRadius:'3px',opacity:1,offset:.56},
        {transform:`translate3d(${dx}px,${dy}px,0) scale(${sx},${sy})`,borderRadius:'0px',opacity:1,offset:1}
      ],{duration:460,easing:'cubic-bezier(.22,.75,.2,1)',fill:'forwards'});
      animation.finished.then(complete,complete);
    };"""
          if old not in s:
            raise SystemExit('Expected Safari selectTab code not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          css="""<style id="safari-smooth-flight-css">
          .safari-smooth-flight{
            position:fixed;z-index:2147483000;box-sizing:border-box;
            transform-origin:0 0;overflow:hidden;pointer-events:none;
            background:#fff;border:1px solid #e1e2e5;
            box-shadow:0 9px 25px #0005;
            contain:layout paint style;
            will-change:transform;border-radius:5px;
            font-family:"Helvetica Neue",Arial,sans-serif;
          }
          .safari-smooth-flight .chrome{
            display:flex;align-items:center;justify-content:center;
            height:32px;padding:0 28px;background:linear-gradient(#fff,#e6e6e9);
            color:#45454c;font-size:12px;font-weight:600;
          }
          .safari-smooth-flight .close{display:none!important}
          .safari-smooth-flight .thumb{
            background:white;display:flex;flex-direction:column;overflow:hidden;
            height:calc(100% - 32px);
          }
          .safari-smooth-flight .safari-snapshot-website{
            height:68%;overflow:hidden;background:#fff;
          }
          .safari-smooth-flight .safari-snapshot-website img{
            display:block;width:100%;height:100%;object-fit:cover;object-position:top;
          }
          .safari-smooth-flight .safari-snapshot-copy{
            display:flex;flex-direction:column;gap:5px;padding:10px 12px;
            font-size:11px;color:#333;background:white;
          }
          .safari-smooth-flight .safari-snapshot-copy span{color:#888;font-size:10px}
          </style>
          """
          if 'id="safari-smooth-flight-css"' not in s:
            s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          print('Safari smooth flight patch applied')
          PY
      - name: Commit updated page
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html
          git commit -m "Smooth Safari card-to-page zoom without abrupt tab swap"
          git pull --rebase origin main
          git push
