name: Install Facebook sticky overlay fix
on:
  push:
    paths: ['.github/workflows/install-facebook-sticky-overlay.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/facebook-profile-sticky-fix.js"></script>'
          if tag not in s:
              assert '</body>' in s
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          css=Path('css/head-18-facebook-profile-phase2-style.css')
          t=css.read_text(encoding='utf-8')
          marker='/* 2026-10-09: keep Cauã'
          if marker in t:t=t[:t.index(marker)].rstrip()+'\n'
          css.write_text(t,encoding='utf-8')
          PY
          node --check js/facebook-profile-sticky-fix.js
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html css/head-18-facebook-profile-phase2-style.css
          git commit -m "Install independent Facebook sticky profile bar and remove failed CSS hacks"
          git pull --rebase origin main
          git push
