name: Verify iOS SVG Toolbars and Status Contrast
on:
  push:
    paths:
      - '.github/workflows/test-ios8-system-chrome.yml'
      - 'js/ios8-system-chrome.js'
      - 'css/ios8-system-chrome.css'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check source and install headless browsers
        run: |
          node --check js/ios8-system-chrome.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('ios8-system-chrome.css')==1
          assert s.count('ios8-system-chrome.js')==1
          assert Path('css/ios8-system-chrome.css').exists()
          assert Path('js/ios8-system-chrome.js').exists()
          PY
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test actual app navigation and toolbar icons
        run: |
          cat >/tmp/test-chrome.cjs <<'JS'
          const {chromium,webkit}=require(process.cwd()+'/node_modules/playwright');
          async function main(browserType,name){
            const browser=await browserType.launch({headless:true});
            async function newPage(){
              const page=await browser.newPage({viewport:{width:500,height:850},hasTouch:true});
              page.on('pageerror',e=>console.log(name,'PAGE_ERROR',e.message));
              await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(600);
              return page;
            }
            try {
              const p=await newPage();
              const initial=await p.evaluate(()=>({exists:!!document.querySelector('#statusBar .status-svg'),mode:document.querySelector('#statusBar')?.dataset.ios8Contrast,fg:getComputedStyle(document.querySelector('#statusBar')).color}));
              console.log(name,'STATUS_INITIAL',JSON.stringify(initial));
              if(!initial.exists)throw Error('Status SVG not installed');
              const withoutBackground=await p.evaluate(()=>{
                const s=document.querySelector('#statusBar'), st=getComputedStyle(s);
                return {background:st.backgroundColor,image:st.backgroundImage,border:st.borderBottomWidth,shadow:st.boxShadow};
              });
              console.log(name,'TRANSPARENT_STATUS',JSON.stringify(withoutBackground));
              if(withoutBackground.background!=='rgba(0, 0, 0, 0)'||withoutBackground.image!=='none'||parseFloat(withoutBackground.border)>0||withoutBackground.shadow!=='none')throw Error('Status bar still paints a background or divider');

              const native=await p.evaluate(()=>{
                const root=document.querySelector('#statusBar');
                const ids=['.signal-dots','.wifi','.bluetooth','.battery'];
                return {source:root.dataset.svgSource,icons:ids.map(sel=>{
                  const host=root.querySelector(sel),glyph=host?.querySelector('svg.ios8-sketch-svg');
                  const b=host?.getBoundingClientRect();
                  return {width:b?.width,height:b?.height,cssWidth:parseFloat(getComputedStyle(host).width),cssHeight:parseFloat(getComputedStyle(host).height),viewBox:glyph?.getAttribute('viewBox'),present:!!glyph};
                })};
              });
              console.log(name,'SKETCH_NATIVE',JSON.stringify(native));
              if(native.source!=='aubrey-sketch-2015-iphone5')throw Error('Not using supplied Sketch file vectors');
              const target=[[24,4.235,'0 0 68 12'],[10.5,7.875,'0 0 24 18'],[6.5,10.579,'0 0 16 26.042'],[21,8.077,'0 0 52 20']];
              native.icons.forEach((glyph,i)=>{
                const [w,h,vb]=target[i];
                if(!glyph.present||Math.abs(glyph.cssWidth-w)>0.12||Math.abs(glyph.cssHeight-h)>0.12||Math.abs(glyph.width/glyph.height-w/h)>0.04||glyph.viewBox!==vb)
                  throw Error('Original Sketch aspect ratio lost for icon '+i+': '+JSON.stringify(glyph));
              });
              await p.evaluate(()=>document.querySelector('[data-app="photos"]')?.click());
              await p.waitForTimeout(450);
              const photos=await p.evaluate(()=>{
                const b=document.querySelectorAll('#photosViewer .photos-viewer-toolbar button');
                const img=document.querySelector('#photosMomentsScroll .photos-thumb img');
                return {buttons:b.length,allSVG:[...b].every(x=>!!x.querySelector('svg.ios8-tool-svg')),photosOpen:document.querySelector('#screen').classList.contains('photos-open'),contrast:document.querySelector('#statusBar').dataset.ios8Contrast,foreground:getComputedStyle(document.querySelector('#statusBar')).color,firstImage:img?.getAttribute('src')};
              });
              console.log(name,'PHOTOS',JSON.stringify(photos));
              if(photos.buttons!==3||!photos.allSVG||!photos.photosOpen||photos.contrast!=='dark'||photos.foreground!=='rgb(32, 33, 36)')throw Error('Photos toolbar or actual visible status ink incorrect');
              await p.close();

              const m=await newPage();
              await m.evaluate(()=>document.querySelector('[data-app="mail"]')?.click());
              await m.waitForTimeout(450);
              const mailStatus=await m.evaluate(()=>({open:document.querySelector('#screen').classList.contains('mail-open'),mode:document.querySelector('#statusBar').dataset.ios8Contrast,compose:!!document.querySelector('#mailToolbar button[data-mail-action="compose"] svg.ios8-tool-svg'),rows:document.querySelectorAll('#mailBody .mail-row').length}));
              console.log(name,'MAIL_INBOX',JSON.stringify(mailStatus));
              if(!mailStatus.open||mailStatus.mode!=='dark'||!mailStatus.compose||!mailStatus.rows)throw Error('Mail inbox status/compose failed');
              await m.locator('#mailBody .mail-row').first().click();
              const mailDetail=await m.evaluate(()=>{const buttons=[...document.querySelectorAll('#mailToolbar button[data-mail-action]')];return{actions:buttons.map(b=>b.dataset.mailAction),allSvg:buttons.every(b=>!!b.querySelector('svg.ios8-tool-svg'))}});
              console.log(name,'MAIL_DETAIL',JSON.stringify(mailDetail));
              if(mailDetail.actions.length!==5||!mailDetail.allSvg)throw Error('Mail detail toolbar missing SVG buttons');
              await m.locator('#mailToolbar [data-mail-action="flag"]').click();
              const flagged=await m.evaluate(()=>!!document.querySelector('#mailToolbar [data-mail-action="flag"].is-flagged svg.ios8-tool-svg'));
              if(!flagged)throw Error('Mail flag click stopped working');
              console.log(name,'MAIL_FLAG_CLICK PASS');
              await m.close();

              const g=await newPage();
              await g.evaluate(()=>document.querySelector('[data-app="goodreader"]')?.click());
              await g.waitForTimeout(1300);
              const good=await g.evaluate(()=>({
                open:document.querySelector('#screen').classList.contains('goodreader-open'),
                mode:document.querySelector('#statusBar').dataset.ios8Contrast,
                nav:!!document.querySelector('#gr4Nav'),
                left:!!document.querySelector('#gr4Nav button[data-gr="root"] .ios8-gr4-svg'),
                right:!!document.querySelector('#gr4Nav button[data-gr="view-setup"] .ios8-gr4-svg'),
                title:document.querySelector('#gr4Nav strong')?.textContent
              }));
              console.log(name,'GOODREADER',JSON.stringify(good));
              if(!good.open||good.mode!=='dark'||!good.left||!good.right)throw Error('GoodReader nav/status failed');
              await g.locator('#gr4Nav button[data-gr="view-setup"]').click();
              const choose=await g.evaluate(()=>({stillOn:!!document.querySelector('#gr4Nav button[data-gr="view-setup"] .ios8-gr4-svg'),text:document.querySelector('#gr4Nav')?.innerText}));
              console.log(name,'GOODREADER_SELECT',JSON.stringify(choose));
              await g.close();

              const f=await newPage();
              await f.evaluate(()=>document.querySelector('[data-app="facebook"]')?.click());
              await f.waitForTimeout(450);
              const fb=await f.evaluate(()=>({opened:document.querySelector('#screen').classList.contains('facebook-open'),mode:document.querySelector('#statusBar').dataset.ios8Contrast,fg:getComputedStyle(document.querySelector('#statusBar')).color}));
              console.log(name,'FACEBOOK',JSON.stringify(fb));
              if(!fb.opened||fb.mode!=='light'||fb.fg!=='rgb(255, 255, 255)')throw Error('Facebook actual white-on-blue contrast failed');
              await f.close();

              // Re-open real app launchers in fresh sessions, not synthetic class
              // toggles, and check that status ink contrasts with the app itself.
              for(const [app,contrast] of [
                ['messages','dark'],['notes','dark'],['calendar','dark'],
                ['safari','dark'],['phone','dark'],['voice','dark'],
                ['whatsapp','light'],['itau','light']]){
                const t=await newPage();
                await t.evaluate(appName=>document.querySelector('[data-app="'+appName+'"]')?.click(),app);
                await t.waitForTimeout(280);
                const mode=await t.evaluate(()=>{
                  const s=document.querySelector('#statusBar'), st=getComputedStyle(s);
                  return {mode:s.dataset.ios8Contrast,ink:st.color,bg:st.backgroundColor};
                });
                console.log(name,'APP_STATUS',app,JSON.stringify(mode));
                if(mode.mode!==contrast||mode.bg!=='rgba(0, 0, 0, 0)' ||
                  mode.ink!==(contrast==='dark'?'rgb(32, 33, 36)':'rgb(255, 255, 255)'))
                  throw Error('Unmatched status contrast for '+app);
                await t.close();
              }
              // The phone's parent can scale; glyph ratios must remain native
              // and their sizes must not jump independently of other UI.
              const ratios=await p.evaluate(()=>{
                const phone=document.querySelector('#phoneWrap'), root=document.documentElement;
                const status=document.querySelector('#statusBar'), s=document.querySelector('#screen');
                const initial=root.style.getPropertyValue('--phone-scale');
                const measured=[];
                for(const scale of ['0.64','1','1.45']){
                  root.style.setProperty('--phone-scale',scale);
                  measured.push({scale,screen:s.getBoundingClientRect().width,
                    status:status.getBoundingClientRect().width,
                    battery:status.querySelector('.battery').getBoundingClientRect().width,
                    wifi:status.querySelector('.wifi').getBoundingClientRect().width});
                }
                root.style.setProperty('--phone-scale',initial);
                return measured;
              });
              console.log(name,'RESPONSIVE_RATIOS',JSON.stringify(ratios));
              if(ratios.some(r=>Math.abs(r.battery/r.screen-21/320)>.004||
                                  Math.abs(r.wifi/r.screen-10.5/320)>.004||
                                  Math.abs(r.status/r.screen-1)>.004))
                throw Error('Status glyphs jump sizes when phone scales');
              console.log(name,'PASS Photos, Mail, GoodReader, status contrast');
            } finally{await browser.close();}
          }
          (async()=>{await main(chromium,'chromium');await main(webkit,'webkit')})().catch(e=>{console.error('FAIL',e.stack||e);process.exit(1)});
          JS
          node /tmp/test-chrome.cjs
