name: Install Voice Memos originals
on:
  push:
    paths:
      - 'voice_icon.*'
      - 'voice_memo_5.*'
      - 'voice_memo_2.*'
      - '.github/workflows/install-voice-memos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: install-voice-memos
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Voice Memos original assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page=Path('index.html')
          html=page.read_text(encoding='utf-8')
          output=Path('assets/voice-memos')
          output.mkdir(parents=True,exist_ok=True)
          wanted={
            'voice_memo_5':('voice-memo-5',{'.m4a','.mp3','.wav','.aac','.ogg','.mp4'}),
            'voice_memo_2':('voice-memo-2',{'.m4a','.mp3','.wav','.aac','.ogg','.mp4'}),
            'voice_icon':('icon',{'.jpg','.jpeg','.png','.webp'})
          }
          count=0
          for key,(memo_id,extensions) in wanted.items():
              matches=[p for p in Path('.').glob(key+'.*') if p.is_file() and p.suffix.lower() in extensions]
              if not matches: continue
              if len(matches)!=1:raise SystemExit('Multiple files found for '+key)
              src=matches[0]
              dest=output/(key+src.suffix.lower())
              dest.write_bytes(src.read_bytes())
              url='./'+dest.as_posix()
              if key=='voice_icon':
                  regex=r'(<div class="app voice-memos-launch"[^>]*>\s*<div class="icon image-icon">\s*<img src=")[^"]+'
                  html,n=re.subn(regex,lambda m:m.group(1)+url,html,count=1)
              else:
                  regex=r'("id":"'+re.escape(memo_id)+r'"[^}]*?"audio":")[^"]*'
                  html,n=re.subn(regex,lambda m:m.group(1)+url,html,count=1,flags=re.S)
              if n!=1:raise SystemExit('Could not map '+key+' to its HTML slot')
              print('Installed '+key+' -> '+url)
              count+=1
          if count:page.write_text(html,encoding='utf-8')
          else:print('No audio/icon upload yet; no change')
          PY
      - name: Commit Voice Memos originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/voice-memos
          git diff --cached --quiet && exit 0
          git commit -m "Restore original Voice Memos recordings and icon"
          git pull --rebase origin main
          git push
